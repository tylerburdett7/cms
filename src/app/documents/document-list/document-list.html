<div class="panel panel-default">
  <div class="panel-heading">
    <div class="row">
      <span class="title pad-left-right">Documents</span>
    </div>
    <div class="pull-right pad-left-right">
      <a class="btn btn-success" [routerLink]="['new']">New Document</a>
    </div>
  </div>

  <div class="panel-body">
    <cms-document-item
      *ngFor="let document of documents"
      [document]="document">
    </cms-document-item>
  </div>
</div>
